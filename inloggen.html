<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inloggen | AllBiz One</title><style>body{margin:0;background:linear-gradient(135deg,#201348,#5136b3);font:16px system-ui,sans-serif;color:#211b3b;min-height:100vh;display:grid;place-items:center}main{box-sizing:border-box;width:min(94%,440px);background:white;border-radius:20px;padding:26px;box-shadow:0 12px 36px #11082b55}h1{margin:0 0 8px;font-size:26px}p{line-height:1.5}label{display:block;font-weight:650;margin:18px 0 7px}input{box-sizing:border-box;width:100%;padding:14px;border:1px solid #bbb3d6;border-radius:10px;font:inherit}button{width:100%;margin-top:18px;padding:14px;border:0;border-radius:11px;background:#5635b9;color:white;font:inherit;font-weight:700}button:disabled{opacity:.6}a{color:#4c2eb0}#message{min-height:30px}small{color:#5c536e}</style></head><body><main><h1>🔐 AllBiz One</h1><p>Log in met je bestaande account.</p><form id="login"><label for="email">E-mailadres</label><input id="email" type="email" autocomplete="email" required><label for="password">Wachtwoord</label><input id="password" type="password" autocomplete="current-password" required><button id="submit" type="submit" disabled>Inloggen</button></form><button id="reset" type="button" disabled style="background:#eee9fc;color:#342265">Wachtwoord vergeten?</button><p id="message" role="status">Beveiligde verbinding wordt geladen…</p><p><a href="./">Terug naar AllBiz One</a></p><small>Voer je wachtwoord alleen in op deze AllBiz One-pagina.</small></main><script type="module">const msg=document.getElementById('message'),submit=document.getElementById('submit'),reset=document.getElementById('reset');try{const {createClient}=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm').catch(()=>import('https://esm.sh/@supabase/supabase-js@2'));const client=createClient("https://woaifabvfqnnunxmhpkc.supabase.co","eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndvYWlmYWJ2ZnFubnVueG1ocGtjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI4Njk3MzMsImV4cCI6MjEwODQ0NTczM30.uDYHF8yKt48Fc6nVrgPpgy_TiizUFM6tAsVRc2dCT10",{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});submit.disabled=false;reset.disabled=false;msg.textContent='Vul je gegevens in.';document.getElementById('login').addEventListener('submit',async e=>{e.preventDefault();submit.disabled=true;msg.textContent='Bezig met inloggen…';try{const {error}=await client.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});if(error)throw error;msg.textContent='Ingelogd! Je wordt doorgestuurd.';const chosen=new URLSearchParams(location.search).get('plan');location.replace(['starter','pro','business'].includes(chosen)?'./abonnementen.html?plan='+encodeURIComponent(chosen):'./#account')}catch(err){msg.textContent=/Invalid login credentials/i.test(err.message)?'E-mailadres of wachtwoord klopt niet.':err.message;submit.disabled=false}});reset.addEventListener('click',async()=>{const email=document.getElementById('email').value.trim();if(!email){msg.textContent='Vul eerst je e-mailadres in.';return}const {error}=await client.auth.resetPasswordForEmail(email,{redirectTo:"https://saelendanielle-coder.github.io/allbiz-one/"});msg.textContent=error?error.message:'Als het e-mailadres bestaat, ontvang je een herstelmail.'})}catch(err){msg.textContent='De beveiligde inlogdienst kon niet worden geladen. Controleer je internetverbinding en probeer opnieuw.'}</script></body></html>
