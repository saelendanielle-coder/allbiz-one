<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inloggen | AllBiz One</title><style>body{margin:0;background:linear-gradient(135deg,#201348,#5136b3);font:16px system-ui,sans-serif;color:#211b3b;min-height:100vh;display:grid;place-items:center}main{box-sizing:border-box;width:min(94%,440px);background:white;border-radius:20px;padding:26px;box-shadow:0 12px 36px #11082b55}h1{margin:0 0 8px;font-size:26px}p{line-height:1.5}label{display:block;font-weight:650;margin:18px 0 7px}input{box-sizing:border-box;width:100%;padding:14px;border:1px solid #bbb3d6;border-radius:10px;font:inherit}button{width:100%;margin-top:18px;padding:14px;border:0;border-radius:11px;background:#5635b9;color:white;font:inherit;font-weight:700}button:disabled{opacity:.6}.secondary{background:#eee9fc;color:#342265}a{color:#4c2eb0}#message{min-height:30px}small{color:#5c536e}</style></head><body><main><h1>🔐 AllBiz One</h1><p>Log in of maak een nieuw account aan.</p><section id="sessionBox" style="padding:14px;background:#f3efff;border-radius:12px;margin:14px 0" aria-live="polite"><strong>Huidig account</strong><p id="currentAccount" style="overflow-wrap:anywhere;margin:8px 0">Account wordt gecontroleerd…</p><button type="button" id="switchAccount" class="secondary">Uitloggen en ander account gebruiken</button></section><form id="login" novalidate><label for="email">E-mailadres</label><input id="email" type="email" autocomplete="email" required><label for="password">Wachtwoord</label><input id="password" type="password" autocomplete="current-password" minlength="8" required><button id="submit" type="submit" disabled>Inloggen</button></form><button id="signupToggle" type="button" class="secondary">Nieuw account aanmaken</button><button id="reset" type="button" disabled class="secondary">Wachtwoord vergeten?</button><p id="message" role="status">Beveiligde verbinding wordt geladen…</p><p><a href="./">Terug naar AllBiz One</a></p><small>Voer je wachtwoord alleen in op deze AllBiz One-pagina.</small></main><script type="module">const msg=document.getElementById('message'),submit=document.getElementById('submit'),reset=document.getElementById('reset'),toggle=document.getElementById('signupToggle'),password=document.getElementById('password');let signup=false;toggle.addEventListener('click',()=>{signup=!signup;submit.textContent=signup?'Account aanmaken':'Inloggen';toggle.textContent=signup?'Ik heb al een account – inloggen':'Nieuw account aanmaken';password.autocomplete=signup?'new-password':'current-password';msg.textContent=signup?'Vul je e-mailadres en een wachtwoord van minimaal 8 tekens in.':'Vul je gegevens in.'});try{const {createClient}=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm').catch(()=>import('https://esm.sh/@supabase/supabase-js@2'));const client=createClient("https://woaifabvfqnnunxmhpkc.supabase.co","eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndvYWlmYWJ2ZnFubnVueG1ocGtjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI4Njk3MzMsImV4cCI6MjEwODQ0NTczM30.uDYHF8yKt48Fc6nVrgPpgy_TiizUFM6tAsVRc2dCT10",{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const currentAccount=document.getElementById('currentAccount'),switchAccount=document.getElementById('switchAccount');async function refreshAccount(){const {data,error}=await client.auth.getUser();currentAccount.textContent=!error&&data.user?'Ingelogd als: '+(data.user.email||'onbekend account'):'Je bent niet ingelogd.';switchAccount.disabled=false;switchAccount.textContent=data.user?'Uitloggen en ander account gebruiken':'Ander account gebruiken';return data.user}switchAccount.addEventListener('click',async()=>{switchAccount.disabled=true;msg.textContent='Account wisselen…';const {error}=await client.auth.signOut({scope:'local'});if(error){msg.textContent='Uitloggen mislukt: '+error.message;switchAccount.disabled=false;return}password.value='';document.getElementById('email').value='';signup=false;submit.textContent='Inloggen';toggle.textContent='Nieuw account aanmaken';await refreshAccount();msg.textContent='Je bent uitgelogd. Log nu in met je andere account.'});submit.disabled=false;reset.disabled=false;await refreshAccount();msg.textContent='Vul je gegevens in.';document.getElementById('login').addEventListener('submit',async e=>{e.preventDefault();const emailValue=document.getElementById('email').value.trim();if(!emailValue||!password.value){msg.textContent='Vul je e-mailadres en wachtwoord in.';return}if(password.value.length<8){msg.textContent='Het wachtwoord moet minimaal 8 tekens bevatten.';return}submit.disabled=true;msg.textContent=signup?'Account aanmaken…':'Bezig met inloggen…';try{const credentials={email:document.getElementById('email').value.trim(),password:password.value};if(signup){const {data,error}=await client.auth.signUp({...credentials,options:{emailRedirectTo:'https://saelendanielle-coder.github.io/allbiz-one/inloggen.html'}});if(error)throw error;msg.textContent=data.session?'Account aangemaakt! Je wordt doorgestuurd.':'Account aangevraagd. Controleer je e-mail om je account te bevestigen.';if(!data.session){submit.disabled=false;return}}else{const {error}=await client.auth.signInWithPassword(credentials);if(error)throw error;msg.textContent='Ingelogd! Je wordt doorgestuurd.'}await refreshAccount();const chosen=new URLSearchParams(location.search).get('plan');location.replace(['starter','pro','business'].includes(chosen)?'./abonnementen.html?plan='+encodeURIComponent(chosen):'./#account')}catch(err){msg.textContent=/Invalid login credentials/i.test(err.message)?'E-mailadres of wachtwoord klopt niet.':err.message;submit.disabled=false}});reset.addEventListener('click',async()=>{const email=document.getElementById('email').value.trim();if(!email){msg.textContent='Vul eerst je e-mailadres in.';return}const {error}=await client.auth.resetPasswordForEmail(email,{redirectTo:"https://saelendanielle-coder.github.io/allbiz-one/"});msg.textContent=error?error.message:'Als het e-mailadres bestaat, ontvang je een herstelmail.'})}catch(err){msg.textContent='De beveiligde inlogdienst kon niet worden geladen. Controleer je internetverbinding en probeer opnieuw.'}</script></body></html>
