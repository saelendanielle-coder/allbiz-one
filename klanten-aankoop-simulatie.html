<!doctype html><html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Albiz One - veilige klantensimulatie</title><style>body{font:16px system-ui;max-width:750px;margin:30px auto;padding:18px}button{padding:12px;margin:6px 0}article{padding:12px;margin:12px 0;border:1px solid #ddd;border-radius:8px}pre{white-space:pre-wrap}</style><h1>Albiz One: drie fictieve klanten</h1><p><strong>Afgeschermde simulatie.</strong> Geen Mollie-betaling, geen echte klantaccounts, geen echte downloads en geen wijziging aan de webshop.</p><button id="start">Simuleer drie aankopen</button><div id="results" aria-live="polite">Nog niet uitgevoerd.</div><script>const people=[{name:"Klant A",paid:true,owns:true},{name:"Klant B",paid:true,owns:true},{name:"Klant C",paid:false,owns:false}];document.getElementById("start").onclick=()=>{let result=[];for(const p of people){const order={customer:p.name,status:p.paid?"paid":"cancelled",digitalFile:"demo-product.pdf"};const allowed=order.status==="paid"&&p.owns;result.push({name:p.name,order,allowed});}const isolated=result[0].order.customer!==result[1].order.customer&&result[0].allowed&&result[1].allowed&&!result[2].allowed;document.getElementById("results").innerHTML=result.map(r=>'<article><strong>'+r.name+'</strong><p>Bestelling: '+r.order.status+'</p><p>Download: '+(r.allowed?'toegestaan (simulatie)':'geweigerd (simulatie)')+'</p></article>').join('')+'<h2>'+(isolated?'GESLAAGD: drie scenario’s correct gesimuleerd':'NIET GESLAAGD')+'</h2><p>Let op: dit is een logische simulatie in de browser, geen integratietest van Mollie of Supabase.</p>';};</script></html>
