<!doctype html><html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AllBiz One · Tastytrade verbinden</title><style>body{font:16px system-ui;background:#f7f5ff;color:#241846;max-width:570px;margin:30px auto;padding:16px}main{background:white;padding:24px;border-radius:16px;box-shadow:0 6px 30px #33226018}input,button{font:inherit;padding:12px;border-radius:9px;margin:5px 0}input{width:100%;box-sizing:border-box;border:1px solid #bcb2d5}button{border:0;background:#5637af;color:white;cursor:pointer}p{line-height:1.5}#msg{white-space:pre-wrap;padding:12px;background:#f2effb;border-radius:9px}</style><main><h1>Tastytrade blijvend verbinden</h1><p>Verbind je Tastytrade-rekening veilig met AllBiz One. Alleen leesrechten. Echt handelen blijft uitgeschakeld.</p><section id="login"><h2>AllBiz One inloggen</h2><input id="email" type="email" placeholder="E-mailadres" autocomplete="email"><input id="password" type="password" placeholder="Wachtwoord" autocomplete="current-password"><button id="signIn">Inloggen</button></section><section id="connected" hidden><p id="account"></p><button id="connect">Tastytrade koppelen</button> <button id="status">Controleer verbinding</button><button id="signOut">Uitloggen</button></section><p id="msg" role="status">Log in om de veilige koppeling te starten.</p><p><a href="./">Terug naar AllBiz One</a></p></main><script type="module">
const base="https://woaifabvfqnnunxmhpkc.supabase.co",anon="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndvYWlmYWJ2ZnFubnVueG1ocGtjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI4Njk3MzMsImV4cCI6MjEwODQ0NTczM30.uDYHF8yKt48Fc6nVrgPpgy_TiizUFM6tAsVRc2dCT10";
const {createClient}=await import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm");const sb=createClient(base,anon),$=x=>document.getElementById(x),say=t=>$("msg").textContent=t;
async function refresh(){const {data:{session}}=await sb.auth.getSession();$("login").hidden=!!session;$("connected").hidden=!session;$("account").textContent=session?"Ingelogd: "+session.user.email:"";return session}
$("signIn").onclick=async()=>{say("Aanmelden…");const {error}=await sb.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});say(error?"Inloggen mislukt: "+error.message:"Ingelogd. Klik op Tastytrade koppelen.");await refresh()};

await refresh();</script></html>
