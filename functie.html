ht=h+'px';new ResizeObserver(function(){frame.style.height=Math.max(750,doc.documentElement.scrollHeight,doc.body.scrollHeight)+'px';}).observe(panel);}catch(e){document.getElementById('description').textContent='Er is een probleem bij het laden van dit onderdeel.';}});})();</script><script>(function(){var f=document.getElementById('feature');if(!f)return;f.addEventListener('load',function(){try{var d=f.contentDocument;var id=new URLSearchParams(location.search).get('onderdeel');if(id==='digital')id='products';var p=d.getElementById(id);if(!p)return;d.body.classList.remove('splash-open');d.getElementById('splashScreen')?.remove();d.querySelectorAll('header,nav,.mobile-feature-picker,#allbizFloatingHelp,#allbizMobileBack,#allbizAccessNotice').forEach(function(e){e.remove()});d.querySelectorAll('main>.panel').forEach(function(e){if(e!==p)e.remove()});d.querySelectorAll('main>.card').forEach(function(e){e.remove()});p.hidden=false;p.removeAttribute('inert');p.classList.remove('allbiz-locked-preview');p.classList.add('active');p.style.setProperty('display','block','important');d.body.setAttribute('data-allbiz-route',id);var st=d.createElement('style');st.textContent='#splashScreen{display:none!important}body.splash-open{overflow:auto!important}body>main{display:block!important;opacity:1!important;visibility:visible!important;transform:none!important}main>.panel.active{display:block!important;opacity:1!important;visibility:visible!important;pointer-events:auto!important}';d.head.appendChild(st);f.style.height=Math.max(800,d.body.scrollHeight)+'px';}catch(e){}},true)})();</script></body></html>
