name: Mollie expiry decision tests (no payments)
on:
  pull_request:
    paths:
      - 'review-only/mollie-expiry-decision.ts'
      - 'review-only/mollie-expiry-decision.test.ts'
      - '.github/workflows/mollie-expiry-decision.yml'
  workflow_dispatch:
jobs:
  expiry:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Typecheck and test expiry policy
        run: |
          deno check review-only/mollie-expiry-decision.ts review-only/mollie-expiry-decision.test.ts
          deno run --no-remote --no-prompt review-only/mollie-expiry-decision.test.ts
