name: Mollie recovery ownership tests (no payments)
on:
  pull_request:
    paths:
      - 'review-only/mollie-recovery-ownership-policy.ts'
      - 'review-only/mollie-recovery-ownership-policy.test.ts'
      - '.github/workflows/mollie-recovery-ownership.yml'
  workflow_dispatch:
jobs:
  recovery-ownership-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Typecheck and run ownership tests
        run: |
          deno check review-only/mollie-recovery-ownership-policy.ts review-only/mollie-recovery-ownership-policy.test.ts
          deno run --no-remote --no-prompt review-only/mollie-recovery-ownership-policy.test.ts
