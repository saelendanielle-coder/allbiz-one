name: Mollie checkout safety tests (no payments)
on:
  pull_request:
    paths:
      - 'review-only/mollie-payment-policy.ts'
      - 'review-only/mollie-payment-policy.test.ts'
      - 'review-only/mollie-orphan-policy.ts'
      - 'review-only/mollie-orphan-policy.test.ts'
      - '.github/workflows/mollie-safety-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pure-policy-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Typecheck and execute all payment-policy scenarios
        run: |
          deno check review-only/mollie-payment-policy.ts review-only/mollie-payment-policy.test.ts review-only/mollie-orphan-policy.ts review-only/mollie-orphan-policy.test.ts
          deno run --no-remote --no-prompt review-only/mollie-payment-policy.test.ts
          deno run --no-remote --no-prompt review-only/mollie-orphan-policy.test.ts
