name: Mollie reconciliation plan tests (no payments)
on:
  pull_request:
    paths:
      - 'review-only/mollie-reconciliation-plan.ts'
      - 'review-only/mollie-reconciliation-plan.test.ts'
      - '.github/workflows/mollie-reconciliation-plan.yml'
  workflow_dispatch:
jobs:
  reconciliation-plan-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Typecheck and execute reconciliation scenarios
        run: |
          deno check review-only/mollie-reconciliation-plan.ts review-only/mollie-reconciliation-plan.test.ts
          deno run --no-remote --no-prompt review-only/mollie-reconciliation-plan.test.ts
