<!doctype html><html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AllBiz One · Mollie testen</title><style>body{font:16px system-ui;background:#f7f5ff;color:#241846;max-width:570px;margin:30px auto;padding:16px}main{background:white;padding:24px;border-radius:16px;box-shadow:0 6px 30px #33226018}input,button{font:inherit;padding:12px;border-radius:9px;margin:5px 0}input{width:100%;box-sizing:border-box;border:1px solid #bcb2d5}button{border:0;background:#5637af;color:white;cursor:pointer;margin-right:8px}button:disabled{opacity:.5}p{line-height:1.5}#msg{white-space:pre-wrap;padding:12px;background:#f2effb;border-radius:9px}small{color:#665d77}</style><main><h1>Maandelijks abonnement testen</h1><p>Test de eerste betaling voor een <b>maandelijks abonnement</b>, zonder echt geld.</p><section id="login"><h2>Inloggen</h2><input id="email" type="email" placeholder="E-mailadres" autocomplete="email"><input id="password" type="password" placeholder="Wachtwoord" autocomplete="current-password"><button id="signIn">Inloggen</button><small>Gebruik je bestaande AllBiz One-account. Geen betaalgegevens invullen.</small></section><section id="payments" hidden><p id="account"></p><button data-plan="starter">Test Starter €10</button><button data-plan="pro">Test Pro €20</button><button data-plan="business">Test Business €30</button><p><button id="check" hidden>Controleer testbetaling</button><button id="signOut">Uitloggen</button></p></section><div id="msg" role="status">Klaar om te testen.</div><p><a href="./">Terug naar AllBiz One</a></p></main><script type="module">
const base="https://woaifabvfqnnunxmhpkc.supabase.co",anon="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndvYWlmYWJ2ZnFubnVueG1ocGtjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI4Njk3MzMsImV4cCI6MjEwODQ0NTczM30.uDYHF8yKt48Fc6nVrgPpgy_TiizUFM6tAsVRc2dCT10";
const {createClient}=await import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm");
const sb=createClient(base,anon),$=id=>document.getElementById(id),say=t=>$("msg").textContent=t;
async function refresh(){const {data:{session}}=await sb.auth.getSession();$("login").hidden=!!session;$("payments").hidden=!session;$("account").textContent=session?"Ingelogd: "+session.user.email:"";return session;}
$("signIn").onclick=async()=>{say("Aanmelden…");const {error}=await sb.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});say(error?"Inloggen mislukt: "+error.message:"Je bent ingelogd.");await refresh();};
$("signOut").onclick=async()=>{await sb.auth.signOut();await refresh();say("Uitgelogd.");};
let lastPayment="";
async function call(slug,body){const session=await refresh();if(!session)throw Error("Log eerst in.");const res=await fetch(base+"/functions/v1/"+slug,{method:"POST",headers:{"Authorization":"Bearer "+session.access_token,"apikey":anon,"Content-Type":"application/json"},body:JSON.stringify(body)});const data=await res.json();if(!res.ok)throw Error(data.error||"Er is iets misgegaan ("+res.status+").");return data;}
document.querySelectorAll("[data-plan]").forEach(b=>b.onclick=async()=>{document.querySelectorAll("[data-plan]").forEach(x=>x.disabled=true);say("Maandelijks testabonnement voorbereiden…");try{const p=await call("allbiz-mollie-recurring-test-start",{plan:b.dataset.plan});lastPayment=p.payment_id;sessionStorage.setItem("allbiz_test_payment",lastPayment);$("check").hidden=false;say("Eerste testbetaling voor maandabonnement aangemaakt. Je wordt doorgestuurd.");location.href=p.checkout_url;}catch(e){say(e.message)}finally{document.querySelectorAll("[data-plan]").forEach(x=>x.disabled=false)}});
$("check").onclick=async()=>{try{const p=await call("allbiz-mollie-test-status",{payment_id:lastPayment});say("Eerste betaling "+p.payment_id+": "+p.status+". Controleer daarna de maandelijkse abonnementstatus.")}catch(e){say(e.message)}};
lastPayment=sessionStorage.getItem("allbiz_test_payment")||"";$("check").hidden=!lastPayment;await refresh();
</script></html>
