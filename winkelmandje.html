<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mijn winkelmandje · Albiz One</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f3fb;color:#211b35;font:16px/1.5 system-ui,Arial}header{background:#291653;color:white;padding:18px}main{max-width:760px;margin:24px auto;padding:0 15px}a{color:#5834b1}header a{color:white}.item,.summary{background:white;border:1px solid #ddd4eb;border-radius:14px;padding:16px;margin:12px 0}.item{display:flex;gap:15px;align-items:center}.item img{width:78px;height:78px;object-fit:cover;border-radius:9px}.details{flex:1;min-width:0}.details strong{display:block}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:9px}button{background:#5834b1;color:white;border:0;border-radius:9px;padding:10px 15px;font-weight:700;cursor:pointer}button.alt{background:#eee8fc;color:#43267b}button:disabled{opacity:.55;cursor:not-allowed}input[type=number]{width:68px;padding:8px;border:1px solid #bdb1d3;border-radius:8px;font-size:16px}.muted{color:#70677e}.summary{position:sticky;bottom:0;box-shadow:0 -3px 15px #22114414}</style></head><body><header><a href="./webshop-bouwen.html">← Terug naar mijn webshop</a><h1>🛒 Mijn winkelmandje</h1></header><main><div id="items"></div><section class="summary"><h2>Besteloverzicht</h2><p id="subtotal"></p><p id="shipping"></p><h3 id="total"></h3><button id="checkout" disabled>Verder naar betalen (nog niet beschikbaar)</button><p class="muted">Dit is een voorbeeldwinkel. Echte betalingen kunnen pas worden ingeschakeld na een veilige koppeling met een betaalprovider en servercontrole.</p><button id="clear" class="alt">Winkelmandje leegmaken</button></section></main><script>(function(){const key='albiz-shop-cart-v1',shopKey='albiz-shop-builder-v2',money=n=>'€ '+(Number(n)||0).toFixed(2).replace('.',',');const $=id=>document.getElementById(id);function read(k){try{return JSON.parse(localStorage.getItem(k)||'{}')}catch(e){return {}}}function cart(){const c=read(key);return c&&typeof c==='object'&&!Array.isArray(c)?c:{}}function save(c){localStorage.setItem(key,JSON.stringify(c))}function draw(){const c=cart(),shop=read(shopKey),products=Array.isArray(shop.products)?shop.products:[],items=$('items');items.replaceChildren();let sum=0,count=0;Object.keys(c).forEach(k=>{const i=Number(k),p=products[i],n=Math.max(0,Math.min(999,Math.floor(Number(c[k])||0)));if(!p||!n)return;count+=n;sum+=(Number(p.price)||0)*n;const row=document.createElement('article');row.className='item';if(p.image&&typeof p.image==='string'&&(p.image.startsWith('data:image/')||p.image.startsWith('https://'))){const img=document.createElement('img');img.src=p.image;img.alt=p.name||'Product';row.append(img)}const info=document.createElement('div');info.className='details';const title=document.createElement('strong');title.textContent=p.name||'Product';const price=document.createElement('span');price.textContent=money(p.price)+' per stuk';const controls=document.createElement('div');controls.className='controls';const label=document.createElement('label');label.textContent='Aantal: ';const input=document.createElement('input');input.type='number';input.min='1';input.max='999';input.value=String(n);input.setAttribute('aria-label','Aantal '+(p.name||'product'));input.onchange=()=>{const v=Math.max(1,Math.min(999,Math.floor(Number(input.value)||1)));const updated=cart();updated[k]=v;save(updated);draw()};label.append(input);const remove=document.createElement('button');remove.className='alt';remove.textContent='Verwijderen';remove.onclick=()=>{const updated=cart();delete updated[k];save(updated);draw()};controls.append(label,remove);info.append(title,price,controls);row.append(info);items.append(row)});if(!count){const p=document.createElement('p');p.textContent='Je winkelmandje is leeg.';items.append(p)}const shipping=Number(shop.shippingCost)||0;const ship=count?Math.max(0,shipping):0;$('subtotal').textContent='Producten: '+money(sum);$('shipping').textContent='Verzendkosten (indicatie): '+money(ship);$('total').textContent='Totaal: '+money(sum+ship)}$('clear').onclick=()=>{save({});draw()};window.addEventListener('storage',draw);draw()})();</script></body></html>
