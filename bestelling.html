<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Jouw bestelling | AllBiz One</title><style>body{font:16px/1.55 system-ui,Arial;margin:0;background:#f8f6ff;color:#242039}main{max-width:650px;margin:50px auto;padding:24px;background:#fff;border:1px solid #ddd4ef;border-radius:16px}a{color:#5131a1}article{padding:10px;border-bottom:1px solid #eee}p{overflow-wrap:anywhere}button{border:0;background:#5940c7;color:white;border-radius:9px;padding:12px 16px;min-height:44px;cursor:pointer}button:disabled{opacity:.6;cursor:wait}</style></head><body><main><h1>📦 Jouw bestelling</h1><p id="status" role="status">Je betaling en bestelling worden beveiligd gecontroleerd…</p><div id="details"></div><p><button type="button" id="refreshDownloads" hidden>↻ Controleer bestelling en vernieuw downloadlinks</button></p><p><a href="./">Terug naar AllBiz One</a></p></main><script>
(async()=>{'use strict';
const $=id=>document.getElementById(id),p=new URLSearchParams(location.search);
const order=p.get('order')||'',session=p.get('session_id')||'';
if(p.get('provider')==='mollie'){
 const storageKey='allbiz-mollie-return:'+order;
 const incomingToken=p.get('token')||'';
 if(/^[a-f0-9-]{36}$/i.test(order)&&/^[A-Za-z0-9_-]{43}$/.test(incomingToken)){try{sessionStorage.setItem(storageKey,incomingToken)}catch{}}
 const token=incomingToken||(function(){try{return sessionStorage.getItem(storageKey)||''}catch{return ''}})();
 if(!/^[a-f0-9-]{36}$/i.test(order)||!/^[A-Za-z0-9_-]{43}$/.test(token)){$('status').textContent='Ongeldige bestelreferentie.';return;}
 history.replaceState(null,'',location.pathname+'?order='+encodeURIComponent(order)+'&provider=mollie');
 const refresh=$('refreshDownloads');refresh.hidden=false;let attempts=0;
 const checkMollie=async()=>{
  refresh.disabled=true;
  try{
   const response=await fetch('https://woaifabvfqnnunxmhpkc.supabase.co/functions/v1/allbiz-paid-download',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'mollie_buyer',order_id:order,token})});
   const data=await response.json();
   if(response.status===202){
    $('status').textContent='Mollie verwerkt je betaling nog. Betaal niet opnieuw.';
    if(attempts++<8)setTimeout(()=>{void checkMollie()},3500);
    else $('status').textContent='Nog geen bevestiging ontvangen. Gebruik de knop om opnieuw te controleren; betaal niet opnieuw.';
    return;
   }
   if(!response.ok||!data.paid)throw Error(data.error||'Betaling nog niet bevestigd');
   $('status').textContent='✅ Betaling bevestigd. Je bestelling is geregistreerd.';
   const details=$('details');details.replaceChildren();
   for(const item of data.items||[]){const line=document.createElement('article');line.textContent=item.quantity+' × '+item.name+' · '+(item.kind==='digital'?'Digitale levering':'Fysieke levering');details.append(line);}
   if(data.downloads?.length){const h=document.createElement('h2');h.textContent='📥 Jouw downloads';details.append(h);
    for(const item of data.downloads){const line=document.createElement('p'),link=document.createElement('a');link.href=item.url;link.target='_blank';link.rel='noopener noreferrer';link.referrerPolicy='no-referrer';link.textContent='⬇ '+item.name;line.append(link);details.append(line);}
   }
   if((data.items||[]).some(i=>i.kind==='digital')&&!data.downloads?.length){const note=document.createElement('p');note.textContent='Het digitale bestand is nog niet beschikbaar. Betaal niet opnieuw en neem contact op met de verkoper.';details.append(note);}
   if((data.items||[]).some(i=>i.kind==='physical')){const note=document.createElement('p');note.textContent='Verzendstatus: '+({awaiting_dispatch:'Wordt klaargemaakt',shipped:'Verzonden',delivered:'Afgeleverd'}[data.fulfillment_status]||'In behandeling');details.append(note);}
  }catch(e){$('status').textContent='⚠️ '+(e.message||'Controle mislukt');}
  finally{refresh.disabled=false;}
 };
 refresh.addEventListener('click',()=>{attempts=0;void checkMollie()});
 await checkMollie();return;
}
if(!/^[a-f0-9-]{36}$/i.test(order)||!/^cs_live_[A-Za-z0-9]+$/.test(session)){$('status').textContent='Ongeldige bestelreferentie.';return;}
const refresh=$('refreshDownloads');
let pendingAttempts=0;
refresh.addEventListener('click',()=>{void check()});
async function check(){
refresh.disabled=true;
try{
const response=await fetch('https://woaifabvfqnnunxmhpkc.supabase.co/functions/v1/allbiz-paid-download',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'buyer_session',order_id:order,session_id:session})});
const data=await response.json();
if(response.status===202){
 $('status').textContent='Betaling wordt nog bevestigd. We controleren automatisch opnieuw; betaal niet opnieuw.';
 refresh.hidden=false;
 if(pendingAttempts++<8)setTimeout(()=>{void check()},3500);
 else $('status').textContent='Betaling nog niet bevestigd. Je kunt hieronder opnieuw controleren; betaal niet opnieuw.';
 return;
}
if(!response.ok||!data.paid)throw Error(data.error||'Bestelling nog niet bevestigd');
$('status').textContent='✅ Betaling bevestigd. Je bestelling is geregistreerd.';
const details=$('details');details.replaceChildren();
for(const item of data.items||[]){const p=document.createElement('article');p.textContent=item.quantity+' × '+item.name+' · '+(item.kind==='digital'?'Digitale levering':'Fysieke levering');details.append(p);}
if(data.downloads?.length){
 const h=document.createElement('h2');h.textContent='📥 Download jouw aankopen';details.append(h);
 for(const item of data.downloads){const link=document.createElement('a');link.href=item.url;link.target='_blank';link.rel='noopener noreferrer';link.referrerPolicy='no-referrer';link.textContent='⬇ '+item.name;const line=document.createElement('p');line.append(link);details.append(line);}
 const note=document.createElement('p');note.textContent='De beveiligde downloadlinks verlopen snel. Werkt een link niet meer? Klik hieronder om nieuwe links op te halen, zonder opnieuw te betalen.';details.append(note);
}
const digitalPending=(data.items||[]).some(i=>i.kind==='digital')&&!data.downloads?.length;
if(digitalPending){const warn=document.createElement('p');warn.textContent='⚠️ Je betaling is bevestigd, maar het digitale bestand is nog niet beschikbaar. Betaal niet opnieuw en neem contact op met de verkoper.';details.append(warn);}
if((data.items||[]).some(i=>i.kind==='physical')){const p=document.createElement('p');p.textContent='Verzendstatus: '+({awaiting_dispatch:'Wordt klaargemaakt voor verzending',shipped:'Verzonden',delivered:'Afgeleverd'}[data.fulfillment_status]||'In behandeling')+'.';details.append(p);
if(data.tracking_number){const track=document.createElement('p');track.textContent='Pakket: '+(data.shipping_carrier||'Bezorgdienst')+' · '+data.tracking_number;details.append(track);}}
refresh.hidden=false;
}catch(e){$('status').textContent='⚠️ '+e.message;refresh.hidden=false;}
finally{refresh.disabled=false;}
}await check();
})();</script></body></html>
