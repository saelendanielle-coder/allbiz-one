<!doctype html><html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Albiz One - echte API-toegangscontrole</title><body style="font:16px system-ui;max-width:700px;margin:30px auto;padding:20px"><h1>Downloadbeveiliging: echte API-test</h1><p>Test rechtstreeks de bestaande Supabase-downloadfunctie met twee ongeldige, maar correct gevormde downloadtokens. Er worden geen betalingen gedaan en geen gegevens aangepast.</p><button id="test" style="padding:12px">Controleer beide klanten</button><pre id="out" style="white-space:pre-wrap" role="status">Nog niet getest</pre><script>document.getElementById('test').onclick=async()=>{const out=document.getElementById('out');out.textContent='Bezig...';const cases=[{name:'Klant A: betaalde bestelling, verkeerd token',id:'8d7f1bba-9f66-4e7b-bd96-8bc63470f69e'},{name:'Klant C: geannuleerde bestelling, verkeerd token',id:'1d4d74f2-2278-4504-9fa3-8c0d0fbd54d2'}];let lines=[];for(const c of cases){try{const r=await fetch('https://woaifabvfqnnunxmhpkc.supabase.co/functions/v1/allbiz-paid-download',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'mollie_buyer',order_id:c.id,token:'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA'})});const b=await r.json();const pass=r.status===404&&!b.downloads&&!b.paid;lines.push(c.name+'\nHTTP '+r.status+' '+JSON.stringify(b)+'\n'+(pass?'GESLAAGD: geen toegang':'NIET GESLAAGD'));}catch(e){lines.push(c.name+'\nFOUT '+e.message)}out.textContent=lines.join('\n\n');}}</script></body></html>
