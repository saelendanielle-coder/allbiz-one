<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>AllBiz One - €1 testlevering</title><style>body{font:16px system-ui;background:#f8f6ff;color:#231a3b;margin:0;padding:20px}main{max-width:630px;margin:48px auto;background:#fff;padding:24px;border-radius:16px}button{padding:12px;cursor:pointer}</style></head>
<body><main><h1>€1-testbetaling</h1><p id="status">Stripe-betaling controleren…</p><button id="retry" hidden>Controleer opnieuw</button><button id="download" hidden>Download testbewijs</button><p><a href="./">Terug naar AllBiz One</a></p></main>
<script>
const p=new URLSearchParams(location.search),s=document.getElementById('status'),retry=document.getElementById('retry'),dl=document.getElementById('download');
if(p.has('cancelled'))s.textContent='Betaling geannuleerd. Er werd hier niets betaald.';
else if(!/^[a-f0-9-]{36}$/i.test(p.get('order_id')||'')||!/^cs_live_[A-Za-z0-9]+$/.test(p.get('session_id')||''))s.textContent='Geen geldige bestelgegevens.';
else{
async function check(){retry.hidden=false;retry.disabled=true;dl.hidden=true;s.textContent='Betaling opvragen…';
try{
const r=await fetch('https://woaifabvfqnnunxmhpkc.supabase.co/functions/v1/allbiz-paid-download',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'owner_1eur_test',order_id:p.get('order_id'),session_id:p.get('session_id')})});
const d=await r.json();
if(r.status===202){s.textContent='Stripe heeft de betaling nog niet bevestigd. Controleer straks opnieuw.';return;}
if(!r.ok||!d.paid)throw Error(d.error||'Nog niet betaald.');
s.textContent='✅ Stripe heeft de €1-betaling bevestigd. Digitaal testbewijs beschikbaar.';
dl.hidden=false;
dl.onclick=()=>{const url=URL.createObjectURL(new Blob([d.content],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='AllBiz-One-testlevering.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000);};
}catch(e){s.textContent='⚠️ '+e.message;}finally{retry.disabled=false;}}
retry.onclick=check;check();}
</script></body></html>
