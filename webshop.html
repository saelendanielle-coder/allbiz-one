<!doctype html><html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Webshop · Albiz One</title><style>body{font:16px system-ui;margin:0;background:#faf8ff;color:#252039}header{padding:22px;background:#5932ac;color:white}main{max-width:1000px;margin:auto;padding:24px}h1{font-size:clamp(25px,5vw,40px)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:18px}.card{border:1px solid #ddd;border-radius:14px;padding:16px;background:white}.card img{display:block;width:100%;height:clamp(260px,65vw,420px);object-fit:cover;object-position:center;background:#24202d;border-radius:10px}.card{overflow:hidden;background:#24202d;color:white}.card img{border-radius:10px}@media(max-width:600px){main{padding:16px}.grid{grid-template-columns:minmax(0,1fr)}.card img{height:360px;max-height:85vw;object-fit:cover}}.hero{border-radius:16px;padding:35px;background:#eee8ff;margin-bottom:24px}footer{padding:25px;text-align:center}</style><header><strong id="brand">Albiz One · Webshop</strong></header><main><section id="linkPanel" style="background:white;border:1px solid #d9d1eb;border-radius:14px;padding:16px;margin-bottom:20px" hidden><strong>🔗 Jouw webshoplink</strong><p id="linkExplanation" style="margin:8px 0">Dit is voorlopig een privévoorbeeld. De openbare webshop is nog niet actief.</p><p id="shopLinkText" style="overflow-wrap:anywhere;font-weight:600"></p><button id="copyShopLink" type="button" style="background:#5932ac;color:white;border:0;border-radius:10px;padding:12px 16px;font-weight:700">📋 Kopieer mijn webshoplink</button><p id="copyFeedback" role="status"></p></section><div id="message" role="status">Webshop laden…</div><div id="shop" hidden><div class="hero" id="hero"><h1 id="headline"></h1><p id="description"></p></div><h2>Producten</h2><div id="products" class="grid"></div><h2>Over ons</h2><p id="about"></p><h2>Contact</h2><p id="contact"></p><h2>Verzending en retouren</h2><p id="shipping"></p><p><strong>Bestellen en betalen is nog niet beschikbaar.</strong></p></div></main><footer>Gemaakt met Albiz One</footer><script type="module">const $=id=>document.getElementById(id);const slug=new URLSearchParams(location.search).get('winkel')||'';const link=new URL(location.href);link.searchParams.delete('versie');const privateMode=link.searchParams.get('voorbeeld')==='1';$('linkPanel').hidden=false;$('shopLinkText').textContent=link.href;$('linkExplanation').textContent=privateMode?'🔒 Privévoorbeeld: deze link werkt alleen voor jou wanneer je bent ingelogd. Nog niet delen met klanten.':'Openbare webshoplink: alleen actief zodra de webshop gepubliceerd is.';$('copyShopLink').onclick=async()=>{try{await navigator.clipboard.writeText(link.href);$('copyFeedback').textContent='✅ Link gekopieerd.'}catch(e){$('copyFeedback').textContent='Selecteer en kopieer de link hierboven.'}};if(!/^[a-z0-9][a-z0-9-]{2,39}$/.test(slug)){$('message').textContent='Geen geldige webshoplink.'}else{try{const {createClient}=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');const c=createClient('https://woaifabvfqnnunxmhpkc.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndvYWlmYWJ2ZnFubnVueG1ocGtjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI4Njk3MzMsImV4cCI6MjEwODQ0NTczM30.uDYHF8yKt48Fc6nVrgPpgy_TiizUFM6tAsVRc2dCT10');let {data,error}=await c.rpc('allbiz_public_shop',{p_slug:slug});if(error)throw error;if(!data&&new URLSearchParams(location.search).get('voorbeeld')==='1'){const {data:auth}=await c.auth.getUser();if(auth?.user){const {data:own}=await c.from('allbiz_shop_slugs').select('slug').eq('user_id',auth.user.id).eq('slug',slug).maybeSingle();if(own){const {data:backup}=await c.from('allbiz_shop_builder_backups').select('design').eq('user_id',auth.user.id).maybeSingle();if(backup?.design){const d=backup.design;data={name:d.name,headline:d.headline,description:d.description,about:d.about,contact:d.contact,shipping:d.shipping,banner:d.banner,bannerPhoto:d.bannerPhoto,products:(d.products||[]).map(p=>({name:p.name,price:p.price,description:p.description,image:p.image}))};$('message').textContent='🔒 Privévoorbeeld — alleen zichtbaar wanneer je bent ingelogd.'}}}}if(!data){$('message').textContent='Deze webshop is nog niet gepubliceerd.'}else{for(const id of ['headline','description','about','contact','shipping'])$(id).textContent=data[id]||'';$('brand').textContent=data.name||'Webshop';document.title=(data.name||'Webshop')+' · Albiz One';const banner=data.bannerPhoto||data.banner;if(typeof banner==='string'&&(banner.startsWith('data:image/jpeg;base64,')||/^https:\/\//.test(banner)))$('hero').style.backgroundImage='linear-gradient(#ffffffbb,#ffffffbb),url("'+banner.replace(/"/g,'%22')+'")';$('hero').style.backgroundSize='cover';for(const p of data.products||[]){const card=document.createElement('article');card.className='card';if(typeof p.image==='string'&&(p.image.startsWith('data:image/')||/^https:\/\//.test(p.image))){const img=document.createElement('img');img.src=p.image;img.alt=p.name||'Product';card.append(img)}const h=document.createElement('h3');h.textContent=p.name||'Product';const price=document.createElement('p');price.textContent=Number.isFinite(Number(p.price))?'€ '+Number(p.price).toFixed(2):'Prijs op aanvraag';const desc=document.createElement('p');desc.textContent=p.description||'';card.append(h,price,desc);$('products').append(card)}if(new URLSearchParams(location.search).get('voorbeeld')!=='1')$('message').hidden=true;$('shop').hidden=false}}catch(e){$('message').textContent='De webshop kan momenteel niet worden geladen.'}}</script></html>
